# Narrow exclusions for files that carry Google's public Gemini CLI and
# Antigravity OAuth client identifiers inherited from upstream Sub2API.
# These are widely distributed client constants, not user tokens or private
# OAuth application secrets. See SECURITY.md before adding paths here.
paths-ignore:
  - "backend/internal/pkg/antigravity/oauth.go"
  - "backend/internal/pkg/antigravity/oauth_test.go"
  - "backend/internal/pkg/geminicli/constants.go"
